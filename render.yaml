# React frontend (Create React App) on Render as a static site
services:
  - type: web
    name: pikiora-frontend
    runtime: static
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://pikiora-clinic.onrender.com/api/
    # Send every page (e.g. /my-appointments) to React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
